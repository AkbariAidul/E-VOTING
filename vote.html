<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('IMG-20241102-WA0013.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            margin: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: linear-gradient(90deg, #FF7F50, #FFA500);
            padding: 10px;
            box-sizing: border-box;
        }
        header h1 {
            font-size: 1.5rem;
            color: white;
            margin: 0;
        }
        header .logos {
            display: flex;
            gap: 10px;
        }
        header .logos img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 80px;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }
        .paslon {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }
        .paslon div {
            flex: 1;
            margin: 0 10px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .paslon div:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        .paslon img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Pemilihan Ketua Umum dan Wakil Ketua Umum Hima TI</h1>
        <div class="logos">
            <img src="Logo_Politeknik_Hasnur.png" alt="Logo 1">
            <img src="LOGO HIMA TI.png" alt="Logo 2">
            <img src="LOGO VISIONARY.png" alt="Logo 3">
        </div>
    </header>

    <div class="container">
        <h2>Memilih Dengan Menggunakan Suara Hati</h2>
        <div class="paslon">
            <div onclick="vote('Paslon 1')">
                <img src="Nadiem-Mendikbud-Ristek-2.jpg" alt="Paslon 1">
                <h3>Paslon 1</h3>
                <p>Ketua : Muhammad Fahmi Iqbal</p>
                <p>Wakil: Muhammad Arif</p>
            </div>
            <div onclick="vote('Paslon 2')">
                <img src="aidulMAnunjuk.jpeg" alt="Paslon 2">
                <h3>Paslon 2</h3>
                <p>Ketua: Muhammad Toha</p>
                <p>Wakil: Mislaini</p>
            </div>
        </div>
    </div>

    <script>
        function vote(paslon) {
            const name = localStorage.getItem('name');
            const nim = localStorage.getItem('nim');

            if (!name || !nim) {
                alert('Anda belum login!');
                window.location.href = 'index.html';
                return;
            }

            alert(`Anda memilih ${paslon}`);
            // Simpan data pemilihan ke localStorage atau kirim ke server
            localStorage.setItem('vote', paslon);

            // Redirect ke halaman terima kasih (thank-you.html)
            window.location.href = 'thank-you.html';
        }
    </script>
</body>
</html>
