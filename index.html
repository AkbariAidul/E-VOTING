<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voting Paslon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('IMG-20241102-WA0013.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg, #FF7F50, #FFA500); /* Gradient warna oranye */
            padding: 10px; /* Ukuran background heading diperkecil */
            box-sizing: border-box;
        }
        header h1 {
            font-size: 2rem;
            color: white;
            margin: 0;
        }
        header .logos {
            display: flex;
            gap: 10px;
        }
        header .logos img {
            width: 60px; /* Ukuran seragam untuk semua logo */
            height: 60px;
            object-fit: contain;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        .container h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        .container button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .container button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Pemilihan Ketua Umum dan Wakil Ketua Umum</h1>
        <div class="logos">
            <img src="Logo_Politeknik_Hasnur.png" alt="Logo 1">
            <img src="LOGO HIMA TI.png" alt="Logo 2">
            <img src="LOGO VISIONARY.png" alt="Logo 3">
        </div>
    </header>
    <div class="container">
        <h2>Silahkan Isi Data Diri</h2>
        <div id="error" class="error"></div>
        <input type="text" id="name" placeholder="Nama">
        <input type="text" id="nim" placeholder="NIM">
        <button onclick="login()">Masuk</button>
    </div>

    <script>
        function login() {
            const name = document.getElementById('name').value;
            const nim = document.getElementById('nim').value;
            const errorDiv = document.getElementById('error');

            if (!name || !nim) {
                errorDiv.textContent = 'Nama dan NIM harus diisi!';
                return;
            }

            localStorage.setItem('name', name);
            localStorage.setItem('nim', nim);

            window.location.href = 'vote.html';
        }
    </script>
</body>
</html>
